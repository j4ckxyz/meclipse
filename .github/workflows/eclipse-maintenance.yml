name: Eclipse maintenance

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: eclipse-maintenance
  cancel-in-progress: false

jobs:
  verify:
    name: Regenerate and verify eclipse data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate coverage surfaces
        run: npm run generate:coverage

      - name: Check future event coverage
        run: node scripts/check-coverage-drift.mjs

      - name: Compare calculations with published data
        run: npm run test:accuracy

      - name: Run unit tests
        run: npm test

      - name: Lint and build
        run: |
          npm run lint
          npm run build

  alert:
    name: Raise a maintenance alert
    needs: verify
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue if one is not already open
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'Automated eclipse maintenance check failed in:title' --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Automated eclipse maintenance check failed" \
              --body "The scheduled coverage or published-data accuracy check failed. Inspect the run: $RUN_URL"
          fi
